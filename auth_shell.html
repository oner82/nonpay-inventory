<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수술실 재고관리 · 직원 인증</title>
  <style>
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; padding:20px; display:grid; place-items:center; color:#182e49; background:#f3f6fa; font:16px/1.5 system-ui,sans-serif; }
    main { width:min(100%,440px); padding:28px; border:1px solid #d2deec; border-radius:16px; background:white; } h1 { margin:0; font-size:23px; } p { color:#425873; } label { display:block; margin:12px 0 4px; font-weight:650; }
    input,button { min-height:44px; font:inherit; border-radius:8px; } input { width:100%; border:1px solid #b6c7d9; padding:8px 10px; } button { cursor:pointer; padding:8px 14px; background:white; color:#224265; border:1px solid #bfd0e2; } button.primary { background:#215da2; color:white; border-color:#215da2; } button:disabled { opacity:.6; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; } fieldset { border:0; padding:0; margin:0; } #status { color:#204d7c; white-space:pre-line; overflow-wrap:anywhere; } small { color:#627691; }
  </style>
</head>
<body><main>
  <h1>수술실 재고관리</h1>
  <p>직원 인증 전환 중입니다. 처음 이용할 때 업무 이메일과 새 비밀번호로 등록하고, 받은 메일에서 주소를 확인해 주세요.</p>
  <form id="authForm"><fieldset id="fields" disabled>
    <label for="email">업무 이메일</label><input id="email" required type="email" autocomplete="username">
    <label for="password">비밀번호</label><input id="password" required type="password" autocomplete="current-password">
    <div class="actions"><button id="login" type="submit" class="primary">로그인</button><button id="register" type="button">직원 계정 등록</button><button id="reset" type="button">비밀번호 재설정</button></div>
  </fieldset></form>
  <div id="signedIn" hidden><strong id="address"></strong><div class="actions"><button type="button" id="openApp" class="primary" hidden>관리자 업무 화면 열기</button><button id="refresh" type="button">인증 상태 확인</button><button id="verify" type="button">인증 메일 다시 받기</button><button id="logout" type="button">로그아웃</button></div></div>
  <p id="status" role="status" aria-live="polite">인증 연결 중…</p><small data-app-version="date"></small>
</main>
<script src="./version.js?v=20261108-ledger-links"></script><script type="module" src="./auth_shell.js?v=20261105-adminpilot"></script>
</body></html>
