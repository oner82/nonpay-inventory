name: Emergency Firebase lockdown
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: firebase-rule-deployment
  cancel-in-progress: false
jobs:
  lockdown:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NONPAY_INVENTORY }}'
      - uses: google-github-actions/setup-gcloud@v2
      - run: python3 .github/security-lockdown/apply.py
