name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Prepare Firebase service account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NONPAY_INVENTORY }}' > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Verify deployment identity
        run: |
          node -e 'const fs = require("fs"); const account = JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, "utf8")); if (!account.client_email || account.project_id !== "nonpay-inventory") throw new Error("Unexpected deployment account project"); console.log("Deployment service account:", account.client_email);'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project nonpay-inventory
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
